<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<title>FamilieFlow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===================== Stijl ===================== */
:root{
  --paper:#faf7f2; --card:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e2d9;
  --brand:#ea580c; --brand-soft:#ffedd5; --soft:#f5f5f4; --danger:#b91c1c;
  --r:16px; --font: ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
ul,ol{list-style:none}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 110px}
.muted{color:var(--muted)} .small{font-size:12px} .bold{font-weight:700}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2.label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0} .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px} .stack>*+*{margin-top:8px} .mt{margin-top:16px}

/* header & nav */
header{position:sticky;top:0;z-index:30;background:rgba(250,247,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-size:18px}
.kicker{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button span{font-size:21px;transition:transform .15s}
nav.tabs button.on{color:var(--ink)} nav.tabs button.on span{transform:scale(1.12)}
@media(min-width:700px){nav.tabs{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:420px;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}}

/* knoppen & velden */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--ink);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fef2f2;color:var(--danger)}
.btn.full{width:100%}
.link{color:var(--brand);font-weight:700;font-size:14px}
.fab{position:fixed;right:20px;bottom:88px;z-index:35;width:56px;height:56px;border-radius:18px;background:var(--ink);color:#fff;font-size:28px;box-shadow:0 10px 25px rgba(0,0,0,.25)}
@media(min-width:700px){.fab{bottom:28px;right:max(20px,calc(50% - 530px))}}
label.f{display:block} label.f>span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.in{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--ink)} textarea.in{height:76px;padding:10px 12px;resize:vertical}
form.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px} .ok{color:#047857;font-size:13px}

/* segment */
.seg{display:inline-flex;background:#e7e5e0;border-radius:12px;padding:3px}
.seg button,.seg label{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg .on,.seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg label{padding:0} .seg label span{display:block;padding:6px 12px;border-radius:9px}
.seg input,.pick input{position:absolute;opacity:0;pointer-events:none}

/* chips, avatars, keuzes */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700}
.chip.plain{padding:6px 12px}
.chip.on{border-color:var(--c,var(--ink));box-shadow:0 0 0 1px var(--c,var(--ink))}
.chip.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.av{display:inline-grid;place-items:center;flex-shrink:0;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:inset 0 0 0 2px var(--c)}
.avstack{display:flex} .avstack .av{margin-left:-6px;border:2px solid #fff} .avstack .av:first-child{margin-left:0}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer}
.pick .tile{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:21px}
.pick .dot{display:block;width:36px;height:36px;border-radius:50%}
.pick input:checked+.tile{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pick input:checked+.dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.pick input:checked+.chip{border-color:var(--c,var(--ink));box-shadow:0 0 0 1px var(--c,var(--ink))}

/* sheet (pop-up van onder) */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .panel{background:var(--paper);width:100%;max-height:90dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));animation:rise .22s ease-out}
#sheet .grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
#sheet h3{font-size:18px;font-weight:800;margin-bottom:16px}
@media(min-width:700px){#sheet{align-items:center} #sheet .panel{max-width:440px;border-radius:24px} #sheet .grip{display:none}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}

#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;font-size:14px;box-shadow:0 10px 25px rgba(0,0,0,.25);display:none}
#toast.show{display:block;animation:pop .35s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}60%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1);opacity:1}}

/* agenda */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.navbtn{width:36px;height:36px;border-radius:10px;font-size:20px} .navbtn:hover{background:#fff}
.month{overflow:hidden}
.month .head,.month .days{display:grid;grid-template-columns:repeat(7,1fr)}
.month .head div{text-align:center;padding:8px 0;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.month .days button{min-height:64px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.month .days button.out{background:#fafaf9;color:#a8a29e}
.daynum{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:800}
.daynum.today{background:var(--brand);color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:3px} .dots i{width:6px;height:6px;border-radius:50%}
.mtitles{display:none;width:100%} .mtitles span{display:block;font-size:11px;font-weight:600;border-radius:4px;padding:0 4px;margin-bottom:2px}
@media(min-width:700px){.month .days button{min-height:96px}.dots{display:none}.mtitles{display:block}}
.week{display:grid;gap:8px}
@media(min-width:700px){.week{grid-template-columns:repeat(7,minmax(0,1fr))} .week .card{min-height:190px;padding:10px} .week .ev{flex-direction:column;align-items:flex-start;gap:4px} .week .ev .grow{width:100%}}
@media(min-width:1000px){.wrap{max-width:1100px}}
.week .card{padding:12px}
.week .card.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;text-align:left}
@media(min-width:700px){.dayhead{flex-direction:column;gap:0}}
.ev{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border-radius:12px;text-align:left;background:color-mix(in srgb,var(--c) 10%,#fff);border-left:4px solid var(--c);margin-top:6px}
.timeline{position:relative}
.hour{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.hour span{display:inline-block;width:42px;padding-right:8px;text-align:right;transform:translateY(-8px);background:#fff}
.tev{position:absolute;z-index:2;overflow:hidden;border-radius:9px;padding:3px 8px;text-align:left;background:color-mix(in srgb,var(--c) 16%,#fff);border-left:4px solid var(--c)}
.nowline{position:absolute;left:42px;right:0;height:2px;background:var(--brand);z-index:3}

/* taken */
.task{display:flex;align-items:center;gap:10px;padding:10px}
.task.done{opacity:.65} .task.done .t{text-decoration:line-through}
.ticon{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:23px;flex-shrink:0}
.pts{background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;flex-shrink:0}
.check{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);font-size:20px;color:transparent;flex-shrink:0;transition:.15s}
.check:hover{border-color:#10b981;color:#10b981} .check:active{transform:scale(.9)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.presets button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;line-height:1.2}
.presets button.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
input[type=range]{width:100%;accent-color:var(--brand);margin-top:12px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.who button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;font-weight:700;font-size:13px}

/* scores */
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .7s}
.split{display:flex;height:20px;border-radius:99px;overflow:hidden}
.meter{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,var(--brand));border-radius:99px;transition:width .7s}
.list>li{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.shopgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.shopitem{position:relative;padding:14px;text-align:center}
.shopitem .del{position:absolute;top:6px;right:10px;font-size:13px}
.shopicon{display:block;font-size:34px;margin-bottom:4px}
.cost{display:inline-block;background:#ede9fe;color:#6d28d9;font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;margin-top:4px}
.who button:disabled{opacity:.4}
.invite{background:var(--brand);color:#fff;border-radius:var(--r);padding:20px}
.code{font:900 38px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.3em;margin:8px 0 12px}

.center{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:380px;margin:0 auto;padding:24px}
.biglogo{width:64px;height:64px;border-radius:20px;background:var(--brand);display:grid;place-items:center;font-size:32px;margin:0 auto 12px;box-shadow:0 10px 25px rgba(234,88,12,.3)}
.pulse{animation:pulse 1.2s infinite} @keyframes pulse{50%{opacity:.4}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="biglogo pulse">🏡</div></div></div>
<div id="sheet"><div class="panel"><div class="grip"></div><h3></h3><div class="body"></div></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   INSTELLINGEN – vul hier je eigen Supabase-gegevens in
   (Supabase → Project Settings → API). De anon key mag openbaar zijn:
   de database-regels (RLS) beschermen de gegevens.
   ===================================================================== */
const SUPABASE_URL = "https://JOUW-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "JOUW-ANON-KEY";

/* ===================== Constanten ===================== */
const COLORS = ["#6366f1","#10b981","#f59e0b","#ef4444","#ec4899","#0ea5e9","#8b5cf6","#14b8a6"];
const AVATARS = ["🙂","😎","🦊","🐻","🐼","🦄","🐸","🐱","🐶","🚀","⚽","🎸"];
const ICONS = ["🧹","🍽️","🗑️","🛒","🪟","🧺","🍳","🛏️","🚿","🌱","🐕","🚗","🧽","📦"];
const SHOP_ICONS = ["🎁","💶","⛽","🚗","🍕","🥡","🍽️","🔄","🧺","🎬","🎟️","🍻"];
const RECUR = { daily:"Dagelijks", weekly:"Wekelijks", none:"Eenmalig" };
const PRESETS = [
  { label:"Klusje", hint:"< 10 min", points:5 }, { label:"Normaal", hint:"± 20 min", points:10 },
  { label:"Flink", hint:"± 45 min", points:20 }, { label:"Zwaar", hint:"1 uur +", points:30 },
];
const HOUR_PX = 52, FIRST_HOUR = 7, LAST_HOUR = 23, HISTORY_DAYS = 62;

/* ===================== Hulpfuncties ===================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeColor = (c) => (/^#[0-9a-f]{6}$/i.test(c) ? c : "#a8a29e");
const pad = (n) => String(n).padStart(2, "0");
const DAY = 86400000;

const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = (d) => { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); }; // maandag
const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const sameDay = (a, b) => startOfDay(a).getTime() === startOfDay(b).getTime();
const isToday = (d) => sameDay(d, new Date());
const toDateInput = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toTimeInput = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fromInputs = (date, time) => new Date(`${date}T${time}:00`);
const fmt = (d, opts) => new Intl.DateTimeFormat("nl-NL", opts).format(new Date(d));
const time = (d) => fmt(d, { hour:"2-digit", minute:"2-digit" });
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const weekNr = (d) => { const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day); const y = new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil(((x - y) / DAY + 1) / 7); };
const periodStart = (p) => (p === "week" ? startOfWeek(new Date()) : startOfMonth(new Date()));

/* ===================== Status ===================== */
const S = {
  user: null, household: null, members: [], tasks: [], events: [], completions: [], rewards: [],
  shop: [], redemptions: [], balances: {},
  tab: "agenda", loading: true,
  cal: { mode: "week", anchor: new Date(), filter: [] },
  taskFilter: "all", period: "week",
  loginMode: "in", onboardMode: "new",
  inviteCode: null,
};

// Uitnodigingslink (…/?code=AB12CD): code onthouden tot iemand ingelogd en aangesloten is
try {
  const fromUrl = new URLSearchParams(location.search).get("code");
  if (fromUrl) sessionStorage.setItem("ff-invite", fromUrl.toUpperCase().slice(0, 6));
  S.inviteCode = sessionStorage.getItem("ff-invite");
} catch {}
if (S.inviteCode) { S.loginMode = "up"; S.onboardMode = "join"; }
const inviteLink = (code) => `${location.origin}${location.pathname}?code=${encodeURIComponent(code)}`;
function clearInvite() {
  try { sessionStorage.removeItem("ff-invite"); } catch {}
  S.inviteCode = null;
  if (location.search.includes("code=")) history.replaceState(null, "", location.pathname);
}
const me = () => S.members.find((m) => m.user_id === S.user?.id);
const member = (id) => S.members.find((m) => m.id === id);

let sb = null;
const configured = !SUPABASE_URL.includes("JOUW-PROJECT");
let DEMO = false;
try { DEMO = localStorage.getItem("ff-demo") === "1" || new URLSearchParams(location.search).has("demo"); } catch {}
if (DEMO) sb = makeDemoClient();
else if (configured) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =====================================================================
   DEMO-STAND – nagebootste database in je browser (localStorage).
   Handig om te proberen zonder Supabase. Niets verlaat je apparaat.
   ===================================================================== */
function makeDemoClient() {
  const KEY = "ff-demo-db";
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  const at = (dayOff, h, m = 0) => { const d = new Date(); d.setDate(d.getDate() + dayOff); d.setHours(h, m, 0, 0); return d.toISOString(); };
  const seed = () => {
    const H = "h1";
    const M = (id, user_id, display_name, color, avatar, role = "member") => ({ id, household_id:H, user_id, display_name, color, avatar, role, created_at:at(-30, 9) });
    const T = (id, title, icon, points, recurrence, assigned_member_id = null) => ({ id, household_id:H, title, icon, points, recurrence, assigned_member_id, archived:false });
    const E = (id, title, start, end, location, all_day = false) => ({ id, household_id:H, title, starts_at:start, ends_at:end, location, notes:null, all_day });
    const C = (task_id, task_title, member_id, points, when) => ({ id:uid(), household_id:H, task_id, task_title, member_id, points, completed_at:when, logged_by:"demo-user" });
    return {
      households: [{ id:H, name:"Familie Demo", invite_code:"DEMO42", created_by:"demo-user" }],
      members: [M("m1","demo-user","Raoul","#6366f1","😎","admin"), M("m2",null,"Sam","#10b981","🎸"), M("m3",null,"Noor","#ec4899","🦊"), M("m4",null,"Daan","#f59e0b","⚽")],
      tasks: [T("t1","Afwassen / vaatwasser","🍽️",10,"daily"), T("t2","Vuilnis buiten zetten","🗑️",5,"weekly","m4"),
        T("t3","Boodschappen doen","🛒",20,"weekly"), T("t4","Ramen lappen","🪟",30,"none"), T("t5","Koken","🍳",20,"daily"),
        T("t6","Badkamer poetsen","🚿",20,"weekly","m3"), T("t7","Gras maaien","🌱",30,"weekly")],
      events: [E("e1","Werk: klant inmeten",at(0,9),at(0,11),"Gouda"), E("e2","Tentamen",at(1,13),at(1,16),"Hogeschool"),
        E("e3","Voetbaltraining",at(0,18,30),at(0,20),"Sportpark"), E("e4","Huisarts",at(2,14),at(2,14,20),null),
        E("e5","Verjaardag oma",at(4,0),at(4,23,59),null,true), E("e6","Bijbaan",at(-1,17),at(-1,21),"Supermarkt")],
      event_members: [["e1","m1"],["e2","m3"],["e3","m4"],["e4","m1"],["e5","m1"],["e5","m2"],["e5","m3"],["e5","m4"],["e6","m2"]].map(([event_id, member_id]) => ({ event_id, member_id })),
      task_completions: [C("t1","Afwassen / vaatwasser","m2",10,at(0,8)), C("t3","Boodschappen doen","m1",20,at(-1,17)),
        C("t5","Koken","m1",20,at(-1,18)), C("t5","Koken","m3",20,at(-2,18)), C("t7","Gras maaien","m4",30,at(-2,11)),
        C("t1","Afwassen / vaatwasser","m4",10,at(-1,20)), C("t6","Badkamer poetsen","m3",20,at(-3,10)),
        C(null,"Auto wassen","m2",20,at(-10,14)), C(null,"Zolder opruimen","m2",60,at(-14,10))],
      shop_items: [["Iemand neemt een taak over","🔄",40],["Je was wordt voor je gedaan","🧺",50],["Kiezen wat we eten","🍕",60],
        ["Auto lenen voor een avond","🚗",80],["€10 tank- of OV-tegoed","⛽",150],["Afhaaleten op kosten van het huis","🥡",200],
        ["Vrienden mee-eten, ouders koken","🍽️",250]].map(([title, icon, cost]) => ({ id:uid(), household_id:H, title, icon, cost, active:true })),
      redemptions: [],
      rewards: [{ id:"r1", household_id:H, title:"Samen uit eten", target_points:400, period:"week", active:true }],
    };
  };
  let db; try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!db) db = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  save();
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const balance = (mid) => db.task_completions.filter((c) => c.member_id === mid).reduce((s, c) => s + c.points, 0)
    - db.redemptions.filter((r) => r.member_id === mid).reduce((s, r) => s + r.cost, 0);

  class Query {
    constructor(table) { Object.assign(this, { table, op:"select", sel:"", filters:[], sort:null, one:false, payload:null }); }
    select(sel) { if (this.op === "select") this.sel = sel || ""; return this; }
    eq(col, val) { this.filters.push((r) => r[col] === val); return this; }
    gte(col, val) { this.filters.push((r) => r[col] >= val); return this; }
    order(col, o = {}) { this.sort = [col, o.ascending !== false]; return this; }
    limit() { return this; }
    insert(p) { this.op = "insert"; this.payload = p; return this; }
    update(p) { this.op = "update"; this.payload = p; return this; }
    delete() { this.op = "delete"; return this; }
    maybeSingle() { this.one = true; return this; }
    single() { this.one = true; return this; }
    run() {
      const rows = db[this.table] ||= [];
      const match = (r) => this.filters.every((f) => f(r));
      if (this.op === "insert") {
        const now = new Date().toISOString();
        const added = (Array.isArray(this.payload) ? this.payload : [this.payload]).map((r) => ({
          id: uid(), created_at: now, ...(this.table === "task_completions" ? { completed_at: now } : {}), ...r }));
        rows.push(...added); save();
        return { data: clone(this.one ? added[0] : added), error: null };
      }
      if (this.op === "update") { rows.filter(match).forEach((r) => Object.assign(r, this.payload)); save(); return { data:null, error:null }; }
      if (this.op === "delete") { db[this.table] = rows.filter((r) => !match(r)); save(); return { data:null, error:null }; }
      let out = rows.filter(match).map((r) => ({ ...r }));
      if (this.sel.includes("households")) out = out.map((r) => ({ ...r, households: db.households.find((h) => h.id === r.household_id) }));
      if (this.sel.includes("event_members")) out = out.map((r) => ({ ...r, event_members: db.event_members.filter((x) => x.event_id === r.id) }));
      if (this.sort) { const [c, asc] = this.sort; out.sort((a, b) => (a[c] > b[c] ? 1 : a[c] < b[c] ? -1 : 0) * (asc ? 1 : -1)); }
      return { data: clone(this.one ? out[0] ?? null : out), error: null };
    }
    then(resolve, reject) { return Promise.resolve().then(() => this.run()).then(resolve, reject); }
  }

  const channel = { on() { return channel; }, subscribe() { return channel; } };
  return {
    auth: {
      getSession: async () => ({ data: { session: { user: { id:"demo-user", email:"demo@familieflow" } } } }),
      onAuthStateChange() {}, signOut: async () => {},
    },
    from: (t) => new Query(t),
    channel: () => channel, removeChannel() {},
    async rpc(name, a) {
      if (name === "member_balances")
        return { data: db.members.map((m) => ({ member_id:m.id, earned:0, spent:0, balance:balance(m.id) })), error:null };
      if (name === "redeem_reward") {
        const it = db.shop_items.find((i) => i.id === a.p_item), m = db.members.find((x) => x.id === a.p_member);
        const b = balance(m.id);
        if (b < it.cost) return { error: { message: `Niet genoeg punten: ${m.display_name} heeft er ${b} en nodig is ${it.cost}` } };
        db.redemptions.unshift({ id:uid(), household_id:it.household_id, item_id:it.id, item_title:it.title, item_icon:it.icon,
          member_id:m.id, cost:it.cost, redeemed_at:new Date().toISOString(), logged_by:"demo-user" });
        save(); return { data:"ok", error:null };
      }
      return { error: { message: "Niet beschikbaar in de demo" } };
    },
  };
}

const load = {
  async members() { const { data } = await sb.from("members").select("*").eq("household_id", S.household.id).order("created_at"); if (data) S.members = data; },
  async tasks() { const { data } = await sb.from("tasks").select("*").eq("household_id", S.household.id).eq("archived", false).order("points", { ascending:false }); if (data) S.tasks = data; },
  async events() {
    const { data } = await sb.from("events").select("*, event_members(member_id)").eq("household_id", S.household.id)
      .gte("ends_at", addDays(new Date(), -90).toISOString()).order("starts_at");
    if (data) S.events = data.map(({ event_members, ...e }) => ({ ...e, member_ids: event_members.map((x) => x.member_id) }));
  },
  async completions() {
    const { data } = await sb.from("task_completions").select("*").eq("household_id", S.household.id)
      .gte("completed_at", addDays(new Date(), -HISTORY_DAYS).toISOString()).order("completed_at", { ascending:false });
    if (data) S.completions = data;
  },
  async rewards() { const { data } = await sb.from("rewards").select("*").eq("household_id", S.household.id).eq("active", true); if (data) S.rewards = data; },
  async shop() { const { data } = await sb.from("shop_items").select("*").eq("household_id", S.household.id).eq("active", true).order("cost"); if (data) S.shop = data; },
  async redemptions() {
    const { data } = await sb.from("redemptions").select("*").eq("household_id", S.household.id)
      .gte("redeemed_at", addDays(new Date(), -HISTORY_DAYS).toISOString()).order("redeemed_at", { ascending:false });
    if (data) S.redemptions = data;
  },
  /** Spaarsaldo per lid over álle tijd (berekend in de database). */
  async balances() {
    const { data } = await sb.rpc("member_balances", { hid: S.household.id });
    if (data) S.balances = Object.fromEntries(data.map((r) => [r.member_id, { earned: +r.earned, spent: +r.spent, balance: +r.balance }]));
  },
};
const balance = (memberId) => S.balances[memberId]?.balance ?? 0;

async function boot() {
  if (!sb) return renderSetup();
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user ?? null;
  if (!S.user) { S.loading = false; return render(); }

  const { data: mem } = await sb.from("members").select("household_id, households(id, name, invite_code)")
    .eq("user_id", S.user.id).order("created_at").limit(1).maybeSingle();
  S.household = mem?.households ?? null;
  if (S.household) clearInvite();
  if (S.household) {
    await Promise.all(Object.values(load).map((f) => f()));
    subscribe();
  }
  S.loading = false;
  render();
}

let channel = null;
function subscribe() {
  if (channel) sb.removeChannel(channel);
  const filter = `household_id=eq.${S.household.id}`;
  channel = sb.channel("hh-" + S.household.id);
  const map = { members:["members"], tasks:["tasks"], events:["events"], task_completions:["completions","balances"],
    rewards:["rewards"], shop_items:["shop"], redemptions:["redemptions","balances"] };
  Object.entries(map).forEach(([table, keys]) =>
    channel.on("postgres_changes", { event:"*", schema:"public", table, filter }, async () => {
      await Promise.all(keys.map((k) => load[k]())); render();
    }));
  channel.on("postgres_changes", { event:"*", schema:"public", table:"event_members" }, async () => { await load.events(); render(); });
  channel.subscribe();
}

function visibleEvents() {
  const f = S.cal.filter;
  return f.length ? S.events.filter((e) => e.member_ids.some((id) => f.includes(id))) : S.events;
}
function eventsOnDay(list, day) {
  const s = startOfDay(day).getTime(), e = s + DAY - 1;
  return list.filter((ev) => new Date(ev.starts_at).getTime() <= e && new Date(ev.ends_at).getTime() >= s)
    .sort((a, b) => (b.all_day - a.all_day) || a.starts_at.localeCompare(b.starts_at));
}
const evColor = (ev) => safeColor(member(ev.member_ids[0])?.color);
const evWho = (ev) => ev.member_ids.map(member).filter(Boolean);

function viewAgenda() {
  const { mode, anchor, filter } = S.cal;
  const ws = startOfWeek(anchor);
  const title = mode === "day" ? cap(fmt(anchor, { weekday:"long", day:"numeric", month:"long" }))
    : mode === "week" ? `Week ${weekNr(anchor)} · ${fmt(ws, { day:"numeric", month:"short" })} – ${fmt(addDays(ws,6), { day:"numeric", month:"short" })}`
    : cap(fmt(anchor, { month:"long", year:"numeric" }));
  const list = visibleEvents();
  const body = mode === "month" ? monthView(anchor, list) : mode === "week" ? weekView(ws, list) : dayView(anchor, list);

  return `
    <div class="toolbar">
      <div class="row" style="gap:2px">
        <button class="navbtn" data-act="calStep" data-v="-1" aria-label="Vorige">‹</button>

        ${evs.length > 3 ? `<span class="muted">+${evs.length - 3}</span>` : ""}</span>

  }

function evChip(e) {
  const when = e.all_day ? "Hele dag" : `${time(e.starts_at)}–${time(e.ends_at)}`;
  return `<button class="ev" style="--c:${evColor(e)}" data-act="editEvent" data-v="${e.id}">

function weekView(ws, list) {
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), evs = eventsOnDay(list, d);
    html += `<div class="card ${isToday(d) ? "today" : ""}">

  }
  return `<div class="week">${html}</div>`;

function dayView(day, list) {
  const evs = eventsOnDay(list, day);
  const allDay = evs.filter((e) => e.all_day || !sameDay(e.starts_at, e.ends_at));
  const timed = evs.filter((e) => !allDay.includes(e));
  const cols = layoutColumns(timed);
  const hours = LAST_HOUR - FIRST_HOUR + 1;
  let grid = "";
  for (let h = 0; h < hours; h++) grid += `<div class="hour" style="top:${h*HOUR_PX}px"><span>${pad(FIRST_HOUR+h)}:00</span></div>`;
  const now = new Date(), nowTop = (now.getHours() + now.getMinutes()/60 - FIRST_HOUR) * HOUR_PX;
  if (isToday(day) && nowTop > 0 && nowTop < hours*HOUR_PX) grid += `<div class="nowline" style="top:${nowTop}px"></div>`;
  for (const e of timed) {
    const s = new Date(e.starts_at), en = new Date(e.ends_at);
    const top = Math.max(0, (s.getHours() + s.getMinutes()/60 - FIRST_HOUR) * HOUR_PX);
    const height = Math.max(26, (en - s) / 3600000 * HOUR_PX - 2);
    const { col, of } = cols.get(e.id);
    grid += `<button class="tev" data-act="editEvent" data-v="${e.id}" style="--c:${evColor(e)};top:${top}px;height:${height}px;
      left:calc(46px + (100% - 46px) * ${col/of});width:calc((100% - 46px) / ${of} - 4px)">
      <span class="bold trunc" style="display:block;font-size:13px">${esc(e.title)}</span>
      <span class="muted small trunc" style="display:block">${time(s)}–${time(en)} ${evWho(e).map((m) => esc(m.avatar)).join("")}</span></button>`;
  }
  return `<div class="card pad">
    ${allDay.length ? `<div style="border-bottom:1px solid var(--line);padding-bottom:10px;margin:-6px 0 14px">${allDay.map(evChip).join("")}</div>` : ""}
    <div class="timeline" style="height:${hours*HOUR_PX}px">${grid}</div></div>`;
}

/** Overlappende afspraken naast elkaar zetten. */
function layoutColumns(events) {
  const sorted = [...events].sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const out = new Map(); let group = [], groupEnd = 0;
  const flush = () => { const of = Math.max(1, ...group.map((g) => g.col + 1)); group.forEach((g) => out.set(g.e.id, { col: g.col, of })); group = []; };
  for (const e of sorted) {
    const s = new Date(e.starts_at).getTime();
    if (group.length && s >= groupEnd) flush();
    const used = new Set(group.filter((g) => new Date(g.e.ends_at).getTime() > s).map((g) => g.col));
    let col = 0; while (used.has(col)) col++;
    group.push({ e, col }); groupEnd = Math.max(groupEnd, new Date(e.ends_at).getTime());
  }
  flush(); return out;
}

      <div class="grid2 times">
        <label class="f"><span>Van</span><input class="in" type="time" name="start" value="${toTimeInput(s)}"></label>
        <label class="f"><span>Tot</span><input class="in" type="time" name="end" value="${toTimeInput(en)}"></label>
      </div>
      <label class="f enddate"><span>Tot en met</span><input class="in" type="date" name="end_date" value="${toDateInput(en)}"></label>
    </div>
    <label class="f"><span>Waar</span><input class="in" name="location" value="${esc(ev?.location)}" placeholder="optioneel"></label>
    <label class="f"><span>Notitie</span><textarea class="in" name="notes" placeholder="bijv. zwemspullen mee">${esc(ev?.notes)}</textarea></label>
    <p class="msg"></p>
    <div class="row">${ev ? `<button type="button" class="btn danger" data-act="deleteEvent" data-v="${ev.id}">Verwijderen</button>` : ""}

}

/* ---------- Taken ---------- */
function currentCompletion(task) {
  const now = new Date();
  const since = task.recurrence === "daily" ? startOfDay(now) : task.recurrence === "weekly" ? startOfWeek(now) : new Date(0);
  return S.completions.find((c) => c.task_id === task.id && new Date(c.completed_at) >= since) ?? null;
}

function viewTasks() {
  const mine = me();
  const rows = S.tasks
    .filter((t) => S.taskFilter === "all" || !t.assigned_member_id || t.assigned_member_id === mine?.id)
    .map((t) => ({ t, c: currentCompletion(t) }));
  const open = rows.filter((r) => !r.c), done = rows.filter((r) => r.c);
  const myWeek = S.completions.filter((c) => c.member_id === mine?.id && new Date(c.completed_at) >= startOfWeek(new Date()))
    .reduce((s, c) => s + c.points, 0);

  const row = ({ t, c }) => {
    const by = c && member(c.member_id), asg = member(t.assigned_member_id);
    const sub = c ? `door ${esc(by?.avatar)} ${esc(by?.display_name)} · ${fmt(c.completed_at, { weekday:"short" })} ${time(c.completed_at)}`
      : `${RECUR[t.recurrence]}${asg ? ` · ${esc(asg.avatar)} ${esc(asg.display_name)}` : ""}`;
    const action = !c ? `<button class="check" data-act="check" data-v="${t.id}" aria-label="Afvinken">✓</button>`
      : c.logged_by === S.user.id && !String(c.id).startsWith("temp")
        ? `<button class="muted small bold" style="height:44px;padding:0 6px" data-act="undo" data-v="${c.id}">Ongedaan</button>`
        : `<span style="width:44px;text-align:center;font-size:20px">✅</span>`;
    return `<li class="card task ${c ? "done" : ""}">
      <button class="row grow" style="text-align:left" data-act="editTask" data-v="${t.id}">
        <span class="ticon">${esc(t.icon)}</span>
        <span class="grow"><span class="t bold trunc" style="display:block">${esc(t.title)}</span><span class="muted small trunc" style="display:block">${sub}</span></span>
      </button><span class="pts">+${t.points}</span>${action}</li>`;
  };

  return `
    <div class="row between" style="align-items:flex-end">
      <div><h1>Wie doet wat</h1><p class="muted small">Jij deze week: <b style="color:var(--ink)">${myWeek} punten</b></p></div>
      ${seg("taskFilter", S.taskFilter, [["all","Alles"],["mine","Voor mij"]])}
    </div>
    <h2 class="label">Te doen · ${open.length}</h2>
    ${open.length ? `<ul class="stack">${open.map(row).join("")}</ul>` : `<p class="card pad muted" style="text-align:center">🎉 Alles gedaan. Lekker bezig!</p>`}
    ${done.length ? `<h2 class="label">Gedaan · ${done.length}</h2><ul class="stack">${done.map(row).join("")}</ul>` : ""}
    <button class="fab" data-act="newTask" aria-label="Nieuwe taak">+</button>`;
}

function taskForm(t) {
  const pts = t?.points ?? 10, icon = t?.icon ?? ICONS[0], rec = t?.recurrence ?? "weekly", asg = t?.assigned_member_id ?? "";
  return `<form data-form="task" data-id="${t?.id ?? ""}" class="stack">

    </div></label>

async function completeTask(task, memberId) {
  closeSheet();
  const temp = { id:"temp-" + Date.now(), household_id:task.household_id, task_id:task.id, task_title:task.title,
    member_id:memberId, points:task.points, completed_at:new Date().toISOString(), logged_by:S.user.id };
  S.completions.unshift(temp);
  if (S.balances[memberId]) S.balances[memberId].balance += task.points;
  render();
  const m = member(memberId);
  toast(`+${task.points} voor ${m?.display_name ?? "?"} ${m?.avatar ?? ""}`);

  const { data, error } = await sb.from("task_completions").insert({
    household_id:task.household_id, task_id:task.id, task_title:task.title, member_id:memberId, points:task.points, logged_by:S.user.id,
  }).select().single();
  S.completions = S.completions.filter((c) => c.id !== temp.id);
  if (error) { await load.balances(); render(); return toast("Mislukt: " + error.message); }
  if (!S.completions.some((c) => c.id === data.id)) S.completions.unshift(data);
  if (task.recurrence === "none") {
    await sb.from("tasks").update({ archived:true }).eq("id", task.id);
    S.tasks = S.tasks.filter((t) => t.id !== task.id);
  }
  await load.balances();
  render();
}

/* ---------- Scores ---------- */
function viewScores() {
  const since = periodStart(S.period).getTime();
  const inPeriod = S.completions.filter((c) => new Date(c.completed_at).getTime() >= since);
  const board = S.members.map((m) => {
    const mine = inPeriod.filter((c) => c.member_id === m.id);
    return { m, points: mine.reduce((s, c) => s + c.points, 0), count: mine.length };
  }).sort((a, b) => b.points - a.points);
  const total = board.reduce((s, r) => s + r.points, 0), max = Math.max(1, ...board.map((r) => r.points));
  const medals = ["🥇","🥈","🥉"];
  const label = S.period === "week" ? "deze week" : "deze maand";

  const rewards = S.rewards.map((r) => {
    const got = S.completions.filter((c) => new Date(c.completed_at) >= periodStart(r.period)).reduce((s, c) => s + c.points, 0);
    const pct = Math.min(100, Math.round(got / r.target_points * 100));
    return `<li class="card pad"><div class="row between"><b>${pct >= 100 ? "🎉" : "🎁"} ${esc(r.title)}</b>
      <button class="muted" data-act="removeReward" data-v="${r.id}" aria-label="Verwijderen">✕</button></div>
      <div class="meter mt" style="margin-top:8px"><i style="width:${pct}%"></i></div>
      <p class="muted small" style="margin-top:6px">${got} / ${r.target_points} punten ${r.period === "week" ? "deze week" : "deze maand"}
      ${pct >= 100 ? " · Gehaald! Tijd om te vieren." : ` · nog ${r.target_points - got} te gaan`}</p></li>`;
  }).join("");

  // Geschiedenis: verdiende én ingewisselde punten door elkaar, nieuwste eerst
  const feed = [
    ...inPeriod.map((c) => ({ at: c.completed_at, m: c.member_id, text: esc(c.task_title), pts: `+${c.points}`, plus: true })),
    ...S.redemptions.filter((r) => new Date(r.redeemed_at).getTime() >= since).map((r) => ({
      at: r.redeemed_at, m: r.member_id, text: `${esc(r.item_icon)} ${esc(r.item_title)} <span class="muted">ingewisseld</span>`, pts: `−${r.cost}`, plus: false,
      undo: r.logged_by === S.user.id || me()?.role === "admin" ? r.id : null })),
  ].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 40);
  const history = feed.map((x) => {
    const m = member(x.m), d = new Date(x.at);
    const day = isToday(d) ? "vandaag" : sameDay(d, addDays(new Date(), -1)) ? "gisteren" : fmt(d, { weekday:"short", day:"numeric", month:"short" });
    return `<li>${avatar(m, 28)}<span class="grow trunc small"><b>${esc(m?.display_name)}</b> · ${x.text}</span>
      <span class="muted small">${day} ${time(d)}</span>
      ${x.undo ? `<button class="muted small" data-act="undoRedeem" data-v="${x.undo}" title="Ongedaan maken">↩</button>` : ""}
      <b style="color:${x.plus ? "var(--brand)" : "#7c3aed"};width:40px;text-align:right">${x.pts}</b></li>`;
  }).join("");

  // Beloningswinkel
  const wallet = S.members.map((m) => `<span class="chip" style="--c:${safeColor(m.color)}">${avatar(m, 24)} ${esc(m.display_name)} <b>${balance(m.id)}</b></span>`).join("");
  const top = Math.max(0, ...S.members.map((m) => balance(m.id)));
  const shop = S.shop.map((it) => `
    <li class="card shopitem">
      <button class="del muted" data-act="removeShopItem" data-v="${it.id}" aria-label="Verwijderen">✕</button>
      <span class="shopicon">${esc(it.icon)}</span>
      <b class="small" style="display:block;min-height:2.6em">${esc(it.title)}</b>
      <span class="cost">${it.cost} pt</span>
      <button class="btn full" style="height:38px;margin-top:8px" data-act="redeem" data-v="${it.id}" ${top < it.cost ? "disabled" : ""}>Inwisselen</button>
    </li>`).join("");

  return `
    <div class="row between" style="align-items:flex-end">
      <div><h1>Scorebord</h1><p class="muted small">${total} punten samen ${label}</p></div>
      ${seg("period", S.period, [["week","Week"],["month","Maand"]])}
    </div>
    <ol class="stack mt" style="list-style:none">${board.map((r, i) => `
      <li class="card pad row"><span style="width:24px;text-align:center;font-size:18px">${r.points > 0 ? (medals[i] ?? i + 1) : "·"}</span>
        ${avatar(r.m, 40)}
        <div class="grow"><div class="row between"><b class="trunc">${esc(r.m.display_name)}</b><b style="font-size:18px">${r.points}</b></div>
          <div class="bar"><i style="width:${r.points / max * 100}%;background:${safeColor(r.m.color)}"></i></div>
          <p class="muted small" style="margin-top:4px">${r.count} ${r.count === 1 ? "taak" : "taken"}</p></div></li>`).join("")}</ol>

    ${total > 0 && S.members.length > 1 ? `<div class="card pad mt"><b>Verdeling</b>
      <p class="muted small" style="margin-bottom:10px">Eerlijk = ± ${Math.round(100 / S.members.length)}% per persoon (of wat jullie samen afspreken)</p>
      <div class="split">${board.filter((r) => r.points).map((r) => `<i style="width:${r.points/total*100}%;background:${safeColor(r.m.color)}"></i>`).join("")}</div>
      <div class="row wrapflex small mt" style="margin-top:10px;gap:6px 14px">${board.map((r) =>
        `<span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:50%;background:${safeColor(r.m.color)}"></i>${esc(r.m.display_name)} <b>${Math.round(r.points/total*100)}%</b></span>`).join("")}</div></div>` : ""}

    <div class="row between"><h2 class="label">Beloningswinkel</h2><button class="link" data-act="newShopItem">+ Beloning</button></div>
    <p class="muted small" style="margin:-2px 0 8px">Spaarsaldo: alle verdiende punten min wat al is ingewisseld.</p>
    <div class="chips" style="margin-bottom:10px">${wallet}</div>
    ${shop ? `<ul class="shopgrid">${shop}</ul>` : `<p class="card pad muted small">Nog geen beloningen. Voeg er een toe, bijv. <i>“auto lenen = 80 punten”</i>.</p>`}

    <div class="row between"><h2 class="label">Samen sparen voor</h2><button class="link" data-act="newReward">+ Doel</button></div>
    ${rewards ? `<ul class="stack">${rewards}</ul>` : `<p class="card pad muted small">Spreek een gezamenlijke beloning af, bijv. <i>“400 punten deze week = pizza-avond”</i>.</p>`}

    <h2 class="label">Geschiedenis</h2>
    <ul class="card list">${history || `<li class="muted small">Nog niets gebeurd in deze periode.</li>`}</ul>`;
}

/* ===================== Sheet & toast ===================== */
function openSheet(title, html) {
  $("#sheet h3").textContent = title;
  $("#sheet .body").innerHTML = html;
  $("#sheet").classList.add("open");
  setTimeout(() => $("#sheet input.in:not([type=date]):not([type=time])")?.focus(), 50);
}
function closeSheet() { $("#sheet").classList.remove("open"); }
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

let toastTimer;
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ===================== Acties (klikken) ===================== */
const actions = {
  tab: (v) => { S.tab = v; render(); scrollTo(0, 0); },
  loginMode: () => { S.loginMode = S.loginMode === "in" ? "up" : "in"; render(); },
  onboardMode: (v) => { S.onboardMode = v; render(); },
  logout: async () => {
    if (DEMO) { try { localStorage.removeItem("ff-demo"); } catch {} return (location.href = location.pathname); }
    await sb.auth.signOut(); location.reload();
  },
  startDemo: () => { try { localStorage.setItem("ff-demo", "1"); } catch {} location.reload(); },
  resetDemo: () => {
    if (!confirm("Alle demogegevens terugzetten naar het begin?")) return;
    try { localStorage.removeItem("ff-demo-db"); } catch {} location.reload();
  },

  calMode: (v) => { S.cal.mode = v; render(); },
  calToday: () => { S.cal.anchor = new Date(); render(); },
  calStep: (v) => {
    const a = new Date(S.cal.anchor), n = +v;
    if (S.cal.mode === "day") a.setDate(a.getDate() + n);
    else if (S.cal.mode === "week") a.setDate(a.getDate() + 7 * n);
    else { a.setDate(1); a.setMonth(a.getMonth() + n); }
    S.cal.anchor = a; render();
  },
  calFilterAll: () => { S.cal.filter = []; render(); },
  calFilter: (v) => { const f = S.cal.filter; S.cal.filter = f.includes(v) ? f.filter((x) => x !== v) : [...f, v]; render(); },
  openDay: (v) => { S.cal.anchor = new Date(+v); S.cal.mode = "day"; render(); },
  newEvent: () => openSheet("Nieuwe afspraak", eventForm(null, S.cal.mode === "day" ? S.cal.anchor : new Date())),
  editEvent: (v) => openSheet("Afspraak bewerken", eventForm(S.events.find((e) => e.id === v))),
  deleteEvent: async (v) => {
    const ev = S.events.find((e) => e.id === v);
    if (!confirm(`"${ev?.title}" verwijderen?`)) return;
    closeSheet(); S.events = S.events.filter((e) => e.id !== v); render();
    await sb.from("events").delete().eq("id", v);
  },

  taskFilter: (v) => { S.taskFilter = v; render(); },
  newTask: () => openSheet("Nieuwe taak", taskForm(null)),
  editTask: (v) => openSheet("Taak bewerken", taskForm(S.tasks.find((t) => t.id === v))),
  preset: (v, el) => {
    const form = el.closest("form"); form.points.value = v; $(".ptsout", form).textContent = v;
    form.querySelectorAll(".presets button").forEach((b) => b.classList.toggle("on", b === el));
  },
  archiveTask: async (v) => {
    closeSheet(); S.tasks = S.tasks.filter((t) => t.id !== v); render();
    await sb.from("tasks").update({ archived:true }).eq("id", v);
  },
  check: (v) => {
    const task = S.tasks.find((t) => t.id === v);
    if (S.members.length === 1) return completeTask(task, me().id);
    const sorted = [...S.members].sort((a, b) => (b.id === me()?.id) - (a.id === me()?.id));
    openSheet(`${task.icon} ${task.title}`, `<p class="muted small" style="margin-bottom:14px">Wie heeft dit gedaan? (+${task.points} punten)</p>
      <div class="who">${sorted.map((m) => `<button data-act="completeAs" data-v="${task.id}" data-m="${m.id}">${avatar(m, 52)}${m.id === me()?.id ? "Ik" : esc(m.display_name)}</button>`).join("")}</div>`);
  },
  completeAs: (v, el) => completeTask(S.tasks.find((t) => t.id === v), el.dataset.m),
  undo: async (v) => {
    const c = S.completions.find((x) => x.id === v);
    S.completions = S.completions.filter((x) => x.id !== v); render();
    const { error } = await sb.from("task_completions").delete().eq("id", v);
    load.balances().then(render);
    if (error) { toast("Mislukt: " + error.message); return load.completions().then(render); }
    if (c?.task_id) { await sb.from("tasks").update({ archived:false }).eq("id", c.task_id).eq("recurrence", "none"); await load.tasks(); render(); }
  },

  period: (v) => { S.period = v; render(); },
  newReward: () => openSheet("Nieuwe beloning", `<form data-form="reward" class="stack">
    <label class="f"><span>Beloning</span><input class="in" name="title" required placeholder="bijv. Pizza-avond & film"></label>
    <label class="f"><span>Doel (punten samen)</span><input class="in" name="target" type="number" min="10" step="10" value="300"></label>
    <label class="f"><span>Per</span><div class="seg">
      <label><input type="radio" name="period" value="week" checked><span>Week</span></label>
      <label><input type="radio" name="period" value="month"><span>Maand</span></label></div></label>
    <button class="btn full">Opslaan</button></form>`),
  newShopItem: () => openSheet("Beloning toevoegen", `<form data-form="shopItem" class="stack">
    <label class="f"><span>Beloning</span><input class="in" name="title" required maxlength="80" placeholder="bijv. auto lenen, tank-tegoed"></label>
    <label class="f"><span>Icoon</span><div class="pick">${SHOP_ICONS.map((i, n) =>
      `<label><input type="radio" name="icon" value="${i}" ${n === 0 ? "checked" : ""}><span class="tile">${i}</span></label>`).join("")}</div></label>
    <label class="f"><span>Kost (punten)</span><input class="in" name="cost" type="number" min="1" max="10000" value="50" required></label>
    <p class="muted small">Ter vergelijking: afwassen levert 10 punten op, boodschappen 20.</p>
    <p class="msg"></p><button class="btn full">Opslaan</button></form>`),
  removeShopItem: async (v) => {
    const it = S.shop.find((x) => x.id === v);
    if (!confirm(`"${it?.title}" uit de winkel halen?`)) return;
    S.shop = S.shop.filter((x) => x.id !== v); render();
    await sb.from("shop_items").update({ active:false }).eq("id", v);
  },
  redeem: (v) => {
    const it = S.shop.find((x) => x.id === v);
    const sorted = [...S.members].sort((a, b) => (b.id === me()?.id) - (a.id === me()?.id));
    openSheet(`${it.icon} ${it.title}`, `<p class="muted small" style="margin-bottom:14px">Wie wisselt ${it.cost} punten in?</p>
      <div class="who">${sorted.map((m) => { const b = balance(m.id), ok = b >= it.cost;
        return `<button data-act="redeemAs" data-v="${it.id}" data-m="${m.id}" ${ok ? "" : "disabled"}>${avatar(m, 52)}
          ${m.id === me()?.id ? "Ik" : esc(m.display_name)}<span class="muted small">${ok ? `${b} → ${b - it.cost}` : `nog ${it.cost - b} nodig`}</span></button>`; }).join("")}</div>`);
  },
  redeemAs: async (v, el) => {
    const it = S.shop.find((x) => x.id === v), m = member(el.dataset.m);
    if (!confirm(`${m.display_name} wisselt ${it.cost} punten in voor "${it.title}". Doorgaan?`)) return;
    closeSheet();
    const { error } = await sb.rpc("redeem_reward", { p_item: it.id, p_member: m.id });
    if (error) return toast(error.message);
    toast(`🎉 ${it.icon} ${it.title} voor ${m.display_name}!`);
    await Promise.all([load.redemptions(), load.balances()]); render();
  },
  undoRedeem: async (v) => {
    const r = S.redemptions.find((x) => x.id === v);
    if (!confirm(`Inwisseling "${r?.item_title}" terugdraaien? De punten komen terug.`)) return;
    const { error } = await sb.from("redemptions").delete().eq("id", v);
    if (error) return toast(error.message);
    await Promise.all([load.redemptions(), load.balances()]); render();
  },
  removeReward: async (v) => { S.rewards = S.rewards.filter((r) => r.id !== v); render(); await sb.from("rewards").update({ active:false }).eq("id", v); },

  share: async () => {
    const text = `Doe mee met "${S.household.name}" in FamilieFlow! Klik op de link (code: ${S.household.invite_code}):\n${inviteLink(S.household.invite_code)}`;
    if (navigator.share) await navigator.share({ text }).catch(() => {});
    else { await navigator.clipboard.writeText(text); toast("Gekopieerd ✓"); }
  },
  copyLink: async () => {
    try { await navigator.clipboard.writeText(inviteLink(S.household.invite_code)); toast("Link gekopieerd ✓"); }
    catch { prompt("Kopieer deze link:", inviteLink(S.household.invite_code)); }
  },
  newMember: () => openSheet("Gezinslid toevoegen", memberForm(null)),
  editMember: (v) => openSheet("Profiel bewerken", memberForm(member(v))),
};

function memberForm(m) {
  return `<form data-form="member" data-id="${m?.id ?? ""}" class="stack">
    <label class="f"><span>Naam</span><input class="in" name="name" required value="${esc(m?.display_name)}"></label>
    ${pickColorsAvatars(m?.color ?? COLORS[2], m?.avatar ?? AVATARS[2])}
    <p class="msg"></p><button class="btn full">Opslaan</button></form>`;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.v, el); }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.actInput === "points") {
    const form = e.target.form; $(".ptsout", form).textContent = e.target.value;
    form.querySelectorAll(".presets button").forEach((b) => b.classList.toggle("on", b.dataset.v === e.target.value));
  }
});
document.addEventListener("change", (e) => {
  if (e.target.name === "all_day") e.target.form.classList.toggle("allday", e.target.checked);
});

/* ===================== Formulieren (opslaan) ===================== */
const forms = {
  async login(f) {
    const email = f.email.value, password = f.password.value;
    const { data, error } = S.loginMode === "in"
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) throw error;
    if (S.loginMode === "up" && !data.session) return "Check je mail en klik op de bevestigingslink.";
    S.loading = true; await boot();
  },
  async onboard(f) {
    const args = { p_display_name: f.name.value.trim(), p_color: f.color.value, p_avatar: f.avatar.value };
    const { error } = S.onboardMode === "new"
      ? await sb.rpc("create_household", { p_name: f.household.value.trim(), ...args })
      : await sb.rpc("join_household", { p_code: f.code.value, ...args });
    if (error) throw error;
    await boot();
  },
  async event(f) {
    const allDay = f.all_day.checked;
    const starts = allDay ? fromInputs(f.date.value, "00:00") : fromInputs(f.date.value, f.start.value || "09:00");
    const ends = allDay ? fromInputs(f.end_date.value < f.date.value ? f.date.value : f.end_date.value, "23:59")
      : fromInputs(f.date.value, f.end.value || f.start.value);
    if (ends < starts) throw new Error("De eindtijd ligt vóór de begintijd.");
    const row = { title: f.title.value.trim(), location: f.location.value.trim() || null, notes: f.notes.value.trim() || null,
      starts_at: starts.toISOString(), ends_at: ends.toISOString(), all_day: allDay };
    const who = [...f.querySelectorAll("[name=who]:checked")].map((x) => x.value);
    let id = f.dataset.id;
    if (id) {
      const r1 = await sb.from("events").update(row).eq("id", id); if (r1.error) throw r1.error;
      await sb.from("event_members").delete().eq("event_id", id);
    } else {
      const { data, error } = await sb.from("events").insert({ ...row, household_id: S.household.id, created_by: S.user.id }).select("id").single();
      if (error) throw error; id = data.id;
    }
    if (who.length) { const r = await sb.from("event_members").insert(who.map((member_id) => ({ event_id: id, member_id }))); if (r.error) throw r.error; }
    await load.events(); closeSheet(); render();
  },
  async task(f) {
    const row = { title: f.title.value.trim(), icon: f.icon.value, points: +f.points.value,
      recurrence: f.recurrence.value, assigned_member_id: f.assigned.value || null };
    const { error } = f.dataset.id
      ? await sb.from("tasks").update(row).eq("id", f.dataset.id)
      : await sb.from("tasks").insert({ ...row, household_id: S.household.id });
    if (error) throw error;
    await load.tasks(); closeSheet(); render();
  },
  async reward(f) {
    const { error } = await sb.from("rewards").insert({ household_id: S.household.id, title: f.title.value.trim(),
      target_points: +f.target.value, period: f.period.value });
    if (error) throw error;
    await load.rewards(); closeSheet(); render();
  },
  async shopItem(f) {
    const { error } = await sb.from("shop_items").insert({ household_id: S.household.id,
      title: f.title.value.trim(), icon: f.icon.value, cost: +f.cost.value });
    if (error) throw error;
    await load.shop(); closeSheet(); render();
  },
  async member(f) {
    const row = { display_name: f.name.value.trim(), color: f.color.value, avatar: f.avatar.value };
    const { error } = f.dataset.id
      ? await sb.from("members").update(row).eq("id", f.dataset.id)
      : await sb.from("members").insert({ ...row, household_id: S.household.id });
    if (error) throw error;
    await load.members(); closeSheet(); render();
  },
};

document.addEventListener("submit", async (e) => {
  const f = e.target, handler = forms[f.dataset.form];
  if (!handler) return;
  e.preventDefault();
  const btn = f.querySelector("button:not([type=button])"), msg = $(".msg", f);
  btn.disabled = true; if (msg) msg.textContent = "";
  try {
    const info = await handler(f);
    if (info && msg) { msg.className = "msg ok"; msg.textContent = info; }
  } catch (err) {
    if (msg) { msg.className = "msg err"; msg.textContent = err.message; } else toast(err.message);
  } finally { btn.disabled = false; }
});

if (sb && !DEMO) sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN" && !S.user) boot(); });
boot();
</script>
</body>
</html>
